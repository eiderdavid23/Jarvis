<main class="auth">
  <div class="auth__marca">
    <h1 class="auth__titulo">JARVIS</h1>
    <p class="auth__sub">Tu asistente inteligente</p>
  </div>

  <form id="auth-form" class="panel" autocomplete="on">
    <input id="auth-nombre" class="campo" type="text" name="nombre" placeholder="Tu nombre" autocomplete="name" hidden>
    <input id="auth-correo" class="campo" type="email" name="email" placeholder="Correo" autocomplete="email" required>
    <input id="auth-clave" class="campo" type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
    <p id="auth-mensaje" class="mensaje" role="alert"></p>
    <button id="auth-enviar" class="boton boton--primario" type="submit">Entrar</button>
    <button id="auth-cambiar" class="boton" type="button">Crear cuenta</button>
  </form>

  <button id="auth-google" class="boton auth__google" type="button">Continuar con Google</button>
</main>
