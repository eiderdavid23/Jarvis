<main class="inicio">
  <header class="inicio__cabecera">
    <h1 class="inicio__titulo">JARVIS</h1>
    <p class="inicio__sub">Mark 1 · Asistente</p>
  </header>

  <section class="orbita" aria-label="Funciones de Jarvis">
    <svg class="orbita__anillos" viewBox="-130 -130 260 260" aria-hidden="true">
      <circle class="anillo anillo--orbita" r="100"/>
      <circle class="anillo anillo--puntos" r="118"/>
      <circle class="anillo anillo--arcos" r="78"/>
      <circle class="anillo anillo--fino" r="64"/>
      <circle class="anillo anillo--centro" r="52"/>
    </svg>

    <button id="inicio-nucleo" class="nucleo" type="button" aria-label="Activar Jarvis"></button>

    <button class="sat" style="--ang:-90deg" type="button" data-ir="chat">
      <span class="sat__icono"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
      <span class="sat__nombre">Chat</span>
    </button>

    <button class="sat" style="--ang:-45deg" type="button" data-ir="gestos">
      <span class="sat__icono"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></span>
      <span class="sat__nombre">Gestos</span>
    </button>

    <button class="sat" style="--ang:0deg" type="button" data-ir="musica">
      <span class="sat__icono"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><path d="M3 18a3 3 0 1 0 6 0a3 3 0 1 0-6 0"/><path d="M15 16a3 3 0 1 0 6 0a3 3 0 1 0-6 0"/></svg></span>
      <span class="sat__nombre">Música</span>
    </button>

    <button class="sat" style="--ang:45deg" type="button" data-ir="tareas">
      <span class="sat__icono"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
      <span class="sat__nombre">Automatizaciones</span>
    </button>

    <button class="sat" style="--ang:90deg" type="button" data-pronto="La voz">
      <span class="sat__icono"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4"/><path d="M8 23h8"/></svg></span>
      <span class="sat__nombre">Voz</span>
    </button>

    <button class="sat" style="--ang:135deg" type="button" data-pronto="Conectores">
      <span class="sat__icono"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
      <span class="sat__nombre">Conectores</span>
    </button>

    <button class="sat" style="--ang:180deg" type="button" data-ir="ajustes">
      <span class="sat__icono"><svg viewBox="0 0 24 24"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg></span>
      <span class="sat__nombre">Ajustes</span>
    </button>

    <button class="sat" style="--ang:225deg" type="button" data-ir="manos">
      <span class="sat__icono"><svg viewBox="0 0 24 24"><path d="M4.04 4.69a.5.5 0 0 1 .65-.65l16 6.5a.5.5 0 0 1-.06.95l-6.13 1.58a2 2 0 0 0-1.43 1.43l-1.58 6.13a.5.5 0 0 1-.95.06z"/></svg></span>
      <span class="sat__nombre">Manos</span>
    </button>
  </section>

  <footer class="inicio__estado">
    <b id="inicio-estado">DESCONECTADO</b>
    <small id="inicio-sub">Toca el núcleo para activar</small>
  </footer>
</main>
