<section class="chat">
  <header class="chat__barra">
    <button class="boton boton--icono" type="button" data-ir="inicio">Inicio</button>
    <h1 class="chat__titulo">JARVIS</h1>
    <div class="chat__acciones">
      <button id="chat-nuevo" class="boton boton--icono" type="button">Nuevo</button>
      <button id="chat-salir" class="boton boton--icono" type="button">Salir</button>
    </div>
  </header>

  <div id="chat-lista" class="chat__lista">
    <p id="chat-vacio" class="chat__vacio">Buenas, señor. ¿En qué le ayudo?</p>
  </div>

  <form id="chat-form" class="chat__entrada">
    <textarea id="chat-texto" class="campo" rows="1" placeholder="Escriba a Jarvis" autocomplete="off"></textarea>
    <button id="chat-enviar" class="boton boton--primario" type="submit">Enviar</button>
  </form>
</section>
