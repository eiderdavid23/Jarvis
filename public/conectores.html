<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conectores</title>
<script>
(function () {
  var p = '';
  try { p = localStorage.getItem('jarvisTema') || ''; } catch (e) {}
  var t = (p === 'claro' || p === 'oscuro') ? p : (matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro');
  document.documentElement.setAttribute('data-tema', t);
})();
</script>
<style>
:root { --fondo: #080c13; --panel: #0e1520; --linea: rgba(150,190,212,.18); --texto: #e9f0f4; --suave: #8c9faa; --cian: #3cd9f2; --mal: #ff7a7a; }
[data-tema="claro"] { --fondo: #f3f5f7; --panel: #fff; --linea: rgba(16,42,58,.16); --texto: #13242d; --suave: #5d727d; --cian: #0a7d98; --mal: #c0392b; }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--fondo); color: var(--texto); font: 15px/1.4 system-ui, sans-serif; }
h1 { font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 22px; margin: 0 0 8px; }
p { margin: 0 0 12px; }
.suave { color: var(--suave); }
.aviso { padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--mal); border-radius: 10px; color: var(--mal); }
.tarjeta { margin-bottom: 10px; border: 1px solid var(--linea); border-radius: 12px; background: var(--panel); overflow: hidden; }
.cab { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.ico { font-size: 22px; width: 28px; text-align: center; }
.tit { flex: 1; min-width: 0; }
.tit b { display: block; }
.tit small { display: block; color: var(--suave); }
.est { padding: 1px 9px; border-radius: 99px; border: 1px solid var(--linea); font-size: 12px; color: var(--suave); white-space: nowrap; }
.est.conectado, .est.listo { color: var(--cian); border-color: var(--cian); }
.cuerpo { padding: 0 12px 12px; border-top: 1px solid var(--linea); }
.campo { margin-top: 12px; }
.campo label { display: block; font-weight: 600; margin-bottom: 4px; }
.campo input, .campo textarea { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--linea); background: var(--fondo); color: var(--texto); font: inherit; }
.campo textarea { min-height: 96px; resize: vertical; }
.campo small { display: block; margin-top: 3px; color: var(--suave); white-space: pre-line; }
.botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
button.b { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--linea); background: var(--panel); color: var(--texto); font: inherit; cursor: pointer; }
button.b.fuerte { border-color: var(--cian); color: var(--cian); }
button.b:disabled { opacity: .5; cursor: default; }
.msg { margin-top: 10px; color: var(--suave); }
.msg.ok { color: var(--cian); }
.msg.mal { color: var(--mal); }
</style>
</head>
<body>
<h1>Conectores</h1>
<p class="suave">Lo que Jarvis puede usar por usted. Sus contraseñas se guardan cifradas. Para enviar un correo o un mensaje de Telegram, Jarvis siempre le muestra el borrador y espera su «sí».</p>
<div id="aviso" class="aviso" hidden></div>
<div id="lista"><p class="suave">Cargando…</p></div>
<script>
(function () {
  'use strict';
  var ACC = 'jarvisAcceso', REF = 'jarvisRefresco', refrescando = null;
  var ETIQ = { conectado: 'Conectado', listo: 'Listo', sin_conectar: 'Sin conectar' };
  var $ = function (id) { return document.getElementById(id); };

  function caduca(seg) {
    try {
      var p = localStorage.getItem(ACC).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(p)).exp * 1000 - Date.now() < seg * 1000;
    } catch (e) { return false; }
  }
  function renovar() {
    if (!refrescando) {
      refrescando = fetch('/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: localStorage.getItem(REF) }) })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || !d.access_token) return false;
          localStorage.setItem(ACC, d.access_token);
          if (d.refresh_token) localStorage.setItem(REF, d.refresh_token);
          return true;
        })
        .catch(function () { return false; })
        .then(function (ok) { refrescando = null; return ok; });
    }
    return refrescando;
  }
  function login() { (window.top || window).location.href = '/'; return new Promise(function () {}); }
  function api(url, metodo, cuerpo, reintento) {
    if (!localStorage.getItem(ACC)) return login();
    var pre = (reintento !== false && caduca(60)) ? renovar() : Promise.resolve(true);
    return pre.then(function () {
      var h = { Authorization: 'Bearer ' + localStorage.getItem(ACC) };
      if (cuerpo !== undefined) h['Content-Type'] = 'application/json';
      return fetch(url, { method: metodo || 'GET', headers: h, body: cuerpo !== undefined ? JSON.stringify(cuerpo) : undefined });
    }).then(function (r) {
      if (r.status === 401 && reintento !== false) return renovar().then(function (ok) { return ok ? api(url, metodo, cuerpo, false) : login(); });
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.error || 'Error ' + r.status);
        return d;
      });
    });
  }

  function el(tag, clase, texto) {
    var e = document.createElement(tag);
    if (clase) e.className = clase;
    if (texto !== undefined) e.textContent = texto;
    return e;
  }

  function tarjeta(c, abierta) {
    var caja = el('div', 'tarjeta');
    var cab = el('button', 'cab'); cab.type = 'button';
    var tit = el('span', 'tit');
    tit.appendChild(el('b', '', c.nombre));
    tit.appendChild(el('small', '', c.descripcion));
    var est = el('span', 'est ' + c.estado, ETIQ[c.estado] || c.estado);
    cab.appendChild(el('span', 'ico', c.icono)); cab.appendChild(tit); cab.appendChild(est);

    var cuerpo = el('div', 'cuerpo'); cuerpo.hidden = !abierta;
    var entradas = {};
    var esGoogle = c.google && c.metodo === 'google';
    c.campos.forEach(function (k) {
      if (esGoogle) return;
      var campo = el('div', 'campo');
      var etiqueta = el('label', '', k.etiqueta);
      var entrada = k.tipo === 'textarea' ? el('textarea') : el('input');
      if (k.tipo !== 'textarea') entrada.type = k.tipo === 'password' ? 'password' : 'text';
      entrada.autocomplete = 'off';
      entrada.id = 'f-' + c.id + '-' + k.id;
      etiqueta.setAttribute('for', entrada.id);
      if (k.tipo === 'password') {
        entrada.placeholder = c.secretos.indexOf(k.id) !== -1 ? 'Guardado (escriba para cambiarlo)' : '';
      } else {
        entrada.value = (c.valores || {})[k.id] || '';
      }
      entradas[k.id] = entrada;
      campo.appendChild(etiqueta); campo.appendChild(entrada);
      if (k.ayuda) campo.appendChild(el('small', '', k.ayuda));
      cuerpo.appendChild(campo);
    });

    var msg = el('p', 'msg');
    function decir(t, tipo) { msg.textContent = t; msg.className = 'msg' + (tipo ? ' ' + tipo : ''); }
    var botones = el('div', 'botones');
    var guardar = el('button', 'b fuerte', 'Guardar'); guardar.type = 'button';
    var probar = el('button', 'b', 'Probar'); probar.type = 'button';
    var google = null;
    if (c.google) {
      var zona = el('div', 'campo');
      if (esGoogle) zona.appendChild(el('p', 'suave', 'Conectado con Google' + (c.valores && c.valores.correo ? ' (' + c.valores.correo + ')' : '') + '. No hace falta contraseña de aplicación.'));
      else if (!c.google_listo) zona.appendChild(el('p', 'msg mal', 'Falta GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET en el servidor (Vercel). Cuando estén, aquí aparece el botón.'));
      else zona.appendChild(el('p', 'suave', 'Un toque y Google le pide el permiso. Jarvis lee, deja borradores y solo envía con su «sí».'));
      zona.appendChild(el('small', 'suave', 'Enlace de retorno para pegar en Google Cloud (URI de redireccionamiento autorizado): ' + (c.google_uri || '')));
      cuerpo.appendChild(zona);
      if (c.google_listo) {
        google = el('button', 'b fuerte', esGoogle ? 'Reconectar con Google' : 'Conectar con Google'); google.type = 'button';
        botones.appendChild(google);
      }
    }
    if (!esGoogle) botones.appendChild(guardar);
    botones.appendChild(probar);
    var quitar = null;
    if (c.estado === 'conectado') {
      quitar = el('button', 'b', 'Desconectar'); quitar.type = 'button';
      botones.appendChild(quitar);
    }
    cuerpo.appendChild(botones); cuerpo.appendChild(msg);

    function ocupado(v) { guardar.disabled = probar.disabled = v; if (quitar) quitar.disabled = v; if (google) google.disabled = v; }
    if (google) google.addEventListener('click', function () {
      ocupado(true); decir('Abriendo Google…');
      api('/conectores/google/iniciar', 'POST', {}).then(function (d) {
        var W = window.top || window, cap = W.Capacitor;
        var nav = cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Browser;
        if (nav && nav.open) { nav.open({ url: d.url }); decir('Termine en Google y vuelva a Jarvis.'); ocupado(false); }
        else W.location.href = d.url;
      }).catch(function (e) { decir(e.message, 'mal'); ocupado(false); });
    });
    guardar.addEventListener('click', function () {
      var datos = {};
      Object.keys(entradas).forEach(function (id) { datos[id] = entradas[id].value; });
      ocupado(true); decir('Guardando y comprobando…');
      api('/conectores/' + c.id, 'PUT', { datos: datos })
        .then(function () { return cargar(c.id); })
        .catch(function (e) { decir(e.message, 'mal'); ocupado(false); });
    });
    probar.addEventListener('click', function () {
      ocupado(true); decir('Probando…');
      api('/conectores/' + c.id + '/probar', 'POST', {})
        .then(function (d) { decir(d.mensaje || 'Listo', 'ok'); })
        .catch(function (e) { decir(e.message, 'mal'); })
        .then(function () { ocupado(false); });
    });
    if (quitar) quitar.addEventListener('click', function () {
      ocupado(true);
      api('/conectores/' + c.id, 'DELETE')
        .then(function () { return cargar(c.id); })
        .catch(function (e) { decir(e.message, 'mal'); ocupado(false); });
    });
    cab.addEventListener('click', function () { cuerpo.hidden = !cuerpo.hidden; });
    caja.appendChild(cab); caja.appendChild(cuerpo);
    return caja;
  }

  function cargar(abrirId) {
    return api('/conectores').then(function (d) {
      var l = $('lista'); l.textContent = '';
      $('aviso').hidden = d.cifrado;
      if (!d.cifrado) $('aviso').textContent = 'Falta la variable LLAVES_SECRET en el servidor: sin ella no se pueden guardar contraseñas (Telegram y Gmail).';
      d.conectores.forEach(function (c) { l.appendChild(tarjeta(c, c.id === abrirId)); });
    }).catch(function (e) {
      var l = $('lista'); l.textContent = '';
      l.appendChild(el('p', 'msg mal', e.message));
    });
  }
  cargar();
})();
</script>
</body>
</html>
