<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEXUS23</title>
<meta name="theme-color" content="#080c13">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>
(function () {
  var p = '';
  try { p = localStorage.getItem('jarvisTema') || ''; } catch (e) {}
  var t = (p === 'claro' || p === 'oscuro') ? p : (matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro');
  document.documentElement.setAttribute('data-tema', t);
})();
</script>
<script>try { if (/[?&]modulo=1/.test(location.search)) document.documentElement.classList.add("modo-modulo"); } catch (e) {}</script>
<link rel="stylesheet" href="/nexus.css">
<link rel="stylesheet" href="/nexus_panel.css">
</head>
<body>
<div id="pantalla" class="centro"><p class="msg">Cargando…</p></div>

<div id="app" hidden>
  <header class="barra">
    <button id="btnMenu" class="icono" aria-label="Abrir menú">☰</button>
    <h1><span class="b1">NEXUS</span><span class="b2">23</span></h1>
    <span id="saludo" class="saludo"></span>
    <button id="btnJarvis" class="ir" type="button" aria-expanded="false">Jarvis</button>
  </header>
  <div class="cuerpo">
    <nav id="menu" class="menu">
      <button data-v="inicio" class="activo">Inicio</button>
      <button data-v="admin" id="navAdmin" hidden>Administración</button>
      <button data-v="cuenta">Cuenta</button>
    </nav>
    <div id="velo" class="velo"></div>
    <main class="principal">
      <section id="v-inicio" class="vista">
        <div id="resumen" class="resumen"></div>
        <p class="etq">Tus plataformas</p>
        <div id="grid" class="grid"></div>
        <button id="btnNueva" class="btn sec">+ Agregar plataforma</button>
      </section>

      <section id="v-admin" class="vista" hidden>
        <p class="etq">Usuarios pendientes</p>
        <div id="pend" class="lista"></div>
        <p class="etq sep">Todos los usuarios</p>
        <div id="usus" class="lista"></div>
        <p class="etq sep">Plataformas globales</p>
        <div id="glob" class="lista"></div>
        <button id="btnGlobal" class="btn sec">+ Agregar plataforma global</button>
        <p class="etq sep">Asignar plataformas a usuarios</p>
        <select id="selAsig"></select>
        <div id="asig" class="lista"></div>
        <p class="etq sep">Plataformas personales de los usuarios</p>
        <div id="ajenas" class="lista"></div>
      </section>

      <section id="v-cuenta" class="vista" hidden>
        <p class="etq">Tu cuenta</p>
        <div id="cuenta" class="tarjeta"></div>
      </section>
    </main>
  </div>
</div>

<aside id="panelJarvis" class="panelj" hidden>
  <div class="pj-barra"><span>Jarvis</span><a class="pj-full" href="/">Abrir completo</a><button id="pjCerrar" class="pj-x" type="button" aria-label="Cerrar panel">✕</button></div>
  <iframe id="pjFrame" title="Jarvis" allow="microphone; autoplay; clipboard-write"></iframe>
</aside>

<div id="modal" class="modal" hidden>
  <form id="mForm" class="mcard">
    <h3 id="mTit"></h3>
    <p id="mTxt" class="msg"></p>
    <div id="mCampos"></div>
    <p id="mErr" class="err"></p>
    <div class="acc">
      <button type="button" id="mNo" class="btn sec">Cancelar</button>
      <button type="submit" class="btn">Aceptar</button>
    </div>
  </form>
</div>
<div id="toast" class="toast" hidden></div>

<script src="/nexus.js"></script>
<script src="/nexus_panel.js"></script>
</body>
</html>
