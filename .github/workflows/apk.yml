name: APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Llave fija de firma
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          test -n "$KS"
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android
      - name: Instalar Capacitor
        working-directory: app
        run: npm install
      - name: Crear proyecto Android
        working-directory: app
        run: npx cap add android
      - name: Icono
        continue-on-error: true
        working-directory: app
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 -b '#05070d' ../nueva/web/icon.svg -o assets/icon.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#05070d'
      - name: Sincronizar
        working-directory: app
        run: npx cap sync android
      - name: Numero de version (siempre sube)
        run: echo "VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"
      - name: Motor del modelo local (llama.cpp)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sudo apt-get install -y patchelf
          mkdir -p /tmp/llama
          cd /tmp/llama
          TAG=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=40" --jq '[.[] | select(any(.assets[]; .name | endswith("-bin-android-arm64.tar.gz")))][0].tag_name')
          echo "Version del motor: $TAG"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then echo "Ningun release reciente trae el motor de Android"; exit 1; fi
          gh release download "$TAG" --repo ggml-org/llama.cpp --pattern '*-bin-android-arm64.tar.gz' --clobber
          ls -la
          for f in *android-arm64*; do
            case "$f" in
              *.tar.gz) tar xzf "$f" ;;
              *.zip) unzip -q -o "$f" ;;
            esac
          done
          BIN=$(find . -name llama-server -type f | head -1)
          test -n "$BIN" || { echo "No encontre llama-server"; find . | head -60; exit 1; }
          DIR=$(dirname "$BIN")
          JNI="$GITHUB_WORKSPACE/app/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          cp "$BIN" "$JNI/libllama_server.so"
          for l in "$DIR"/*.so; do
            if [ -f "$l" ]; then cp "$l" "$JNI/"; fi
          done
          cd "$JNI"
          for f in *.so; do
            for n in $(readelf -d "$f" | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p'); do
              base=$(echo "$n" | sed 's/[.]so[.].*/.so/')
              if [ "$base" != "$n" ] && [ -f "$base" ]; then patchelf --replace-needed "$n" "$base" "$f"; fi
            done
          done
          ls -la
          readelf -d libllama_server.so | grep -i needed || true

      - name: Parches nativos
        working-directory: app
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 parches.py
      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - name: Firma y version de la APK
        continue-on-error: true
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs app/android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
          echo "versionCode: $VERSION_CODE"
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk jarvis.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest jarvis.apk --title "Jarvis APK" --notes "build ${{ github.run_number }} - versionCode ${VERSION_CODE}"
